<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#10182f"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="100%" stop-color="#ffb199"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="100%" stop-color="#60efff"/>
    </linearGradient>

    <!-- Filters for glowing effects -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#00f2fe" flood-opacity="0.3"/>
    </filter>

    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 400; fill: #94a3b8; font-size: 18px; }
      .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
      
      /* Dynamic Conveyor & Pulse Animations */
      @keyframes dashMove {
        from { stroke-dashoffset: 60; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.08); }
      }
      @keyframes agvMove {
        0% { transform: translateX(0px); }
        50% { transform: translateX(260px); }
        100% { transform: translateX(0px); }
      }
      @keyframes craneLift {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-40px); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes beaconBlink {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
      
      .conveyor-belt { stroke-dasharray: 10, 10; animation: dashMove 1.5s linear infinite; }
      .conveyor-belt-rev { stroke-dasharray: 8, 8; animation: dashMove 2s linear infinite reverse; }
      .glow-circle { transform-origin: center; animation: pulseGlow 3s ease-in-out infinite; }
      .agv-bot { animation: agvMove 8s ease-in-out infinite; }
      .crane-arm { animation: craneLift 6s ease-in-out infinite; }
      .radar-arm { transform-origin: 1050px 80px; animation: radarSweep 5s linear infinite; }
      .blinking-light { animation: beaconBlink 1.2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Cyber Grid Background -->
  <g opacity="0.12" stroke="#4facfe" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="720" y1="0" x2="720" y2="360"/>
    <line x1="840" y1="0" x2="840" y2="360"/>
    <line x1="960" y1="0" x2="960" y2="360"/>
    <line x1="1080" y1="0" x2="1080" y2="360"/>
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="180" r="140" fill="#00f2fe" opacity="0.08" class="glow-circle" filter="url(#glowCyan)"/>
  <circle cx="1020" cy="160" r="160" fill="#00ff87" opacity="0.06" class="glow-circle" filter="url(#glowGreen)"/>

  <!-- Isometric / Futuristic Automated Warehouse Graphic (Right side) -->
  <g transform="translate(680, 40)">
    <!-- AS/RS High-Bay Racking Structure -->
    <g stroke="#334155" stroke-width="2" fill="none" opacity="0.7">
      <!-- Rack columns & beams -->
      <rect x="180" y="30" width="280" height="230" rx="4" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b"/>
      <!-- Grid cells -->
      <line x1="180" y1="85" x2="460" y2="85" stroke="#334155"/>
      <line x1="180" y1="140" x2="460" y2="140" stroke="#334155"/>
      <line x1="180" y1="195" x2="460" y2="195" stroke="#334155"/>
      <line x1="250" y1="30" x2="250" y2="260" stroke="#334155"/>
      <line x1="320" y1="30" x2="320" y2="260" stroke="#334155"/>
      <line x1="390" y1="30" x2="390" y2="260" stroke="#334155"/>

      <!-- Stored Pallets / Totes in Racks -->
      <rect x="190" y="42" width="50" height="32" rx="3" fill="#0284c7" fill-opacity="0.6" stroke="#38bdf8"/>
      <rect x="260" y="42" width="50" height="32" rx="3" fill="#059669" fill-opacity="0.6" stroke="#34d399"/>
      <rect x="330" y="97" width="50" height="32" rx="3" fill="#d97706" fill-opacity="0.6" stroke="#fbbf24"/>
      <rect x="400" y="152" width="50" height="32" rx="3" fill="#7c3aed" fill-opacity="0.6" stroke="#a78bfa"/>
      <rect x="190" y="207" width="50" height="32" rx="3" fill="#0284c7" fill-opacity="0.6" stroke="#38bdf8"/>
      <rect x="260" y="152" width="50" height="32" rx="3" fill="#059669" fill-opacity="0.6" stroke="#34d399"/>
      <rect x="400" y="42" width="50" height="32" rx="3" fill="#e11d48" fill-opacity="0.6" stroke="#fb7185"/>
      <rect x="330" y="207" width="50" height="32" rx="3" fill="#0284c7" fill-opacity="0.6" stroke="#38bdf8"/>
    </g>

    <!-- AS/RS Crane Mast & Animated Carriage -->
    <g stroke="#00f2fe" stroke-width="2">
      <line x1="215" y1="20" x2="215" y2="270" stroke="#0ea5e9" stroke-width="3"/>
      <g class="crane-arm" transform="translate(0, 40)">
        <rect x="200" y="100" width="30" height="22" rx="3" fill="#0284c7" stroke="#38bdf8" filter="url(#glowCyan)"/>
        <!-- Crane beam & forks -->
        <line x1="230" y1="111" x2="265" y2="111" stroke="#38bdf8" stroke-width="3"/>
        <circle cx="205" cy="111" r="3" fill="#00ff87" class="blinking-light"/>
      </g>
    </g>

    <!-- Main Conveyor Line (Animated Pulses) -->
    <g transform="translate(0, 240)">
      <!-- Conveyor track -->
      <rect x="20" y="15" width="440" height="20" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
      <line x1="25" y1="25" x2="455" y2="25" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" class="conveyor-belt" filter="url(#glowCyan)"/>
      
      <!-- Moving Totes on Conveyor -->
      <rect x="60" y="3" width="36" height="20" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="180" y="3" width="36" height="20" rx="3" fill="#059669" stroke="#34d399" stroke-width="1.5"/>
      <rect x="320" y="3" width="36" height="20" rx="3" fill="#d97706" stroke="#fbbf24" stroke-width="1.5"/>
    </g>

    <!-- AGV / AMR Autonomous Robot (Animated Movement) -->
    <g class="agv-bot" transform="translate(20, 280)">
      <rect x="0" y="0" width="70" height="28" rx="8" fill="#1e293b" stroke="#00ff87" stroke-width="2" filter="url(#glowGreen)"/>
      <circle cx="16" cy="24" r="5" fill="#334155" stroke="#64748b"/>
      <circle cx="54" cy="24" r="5" fill="#334155" stroke="#64748b"/>
      <circle cx="12" cy="12" r="3" fill="#00ff87" class="blinking-light"/>
      <circle cx="58" cy="12" r="3" fill="#00ff87" class="blinking-light"/>
      <!-- Loaded Cargo Box on AGV -->
      <rect x="15" y="-18" width="40" height="18" rx="3" fill="#6366f1" stroke="#818cf8" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Left Content: Headers, Badges, Branding -->
  <g transform="translate(60, 65)">
    <!-- Category Mini-Tag -->
    <g transform="translate(0, 0)">
      <rect width="210" height="28" rx="14" fill="#0369a1" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="1"/>
      <circle cx="14" cy="14" r="4" fill="#00ff87" class="blinking-light"/>
      <text x="28" y="19" class="badge-text" fill="#38bdf8">INTRALOGISTICS &amp; WCS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="75" class="title" font-size="44" fill="url(#cyanGrad)">Awesome WCS</text>
    <text x="0" y="115" class="title" font-size="28" fill="#f8fafc">Warehouse Control Systems</text>

    <!-- Subtitle -->
    <text x="0" y="152" class="subtitle">Material Flow Control (MFC) • Execution (WES) • PLC Automation</text>

    <!-- Interactive Badges Pill Box -->
    <g transform="translate(0, 185)">
      <!-- Pill 1: Real-time MHE -->
      <g transform="translate(0, 0)">
        <rect width="130" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="16" y="21" class="badge-text">⚡ Real-Time MHE</text>
      </g>

      <!-- Pill 2: AS/RS & Conveyors -->
      <g transform="translate(140, 0)">
        <rect width="165" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="16" y="21" class="badge-text">📦 AS/RS &amp; Conveyors</text>
      </g>

      <!-- Pill 3: AMRs & Robotics -->
      <g transform="translate(315, 0)">
        <rect width="145" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="16" y="21" class="badge-text">🤖 AGV / AMR Fleets</text>
      </g>

      <!-- Pill 4: Open Source -->
      <g transform="translate(470, 0)">
        <rect width="140" height="32" rx="16" fill="#0f766e" fill-opacity="0.4" stroke="#14b8a6" stroke-width="1"/>
        <text x="16" y="21" class="badge-text" fill="#2dd4bf">⭐ Open Source</text>
      </g>
    </g>
  </g>
</svg>
