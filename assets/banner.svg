<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Title Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Tag & Pill Gradients -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Cyber Grid Background -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>

    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="700" y1="0" x2="700" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
    <line x1="1100" y1="0" x2="1100" y2="360"/>
  </g>

  <!-- Ambient Dynamic Pulsing Glow Orbs -->
  <circle cx="160" cy="180" r="130" fill="#00f2fe" opacity="0.06">
    <animate attributeName="r" values="120;145;120" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.04;0.08;0.04" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020" cy="160" r="140" fill="#10b981" opacity="0.05">
    <animate attributeName="r" values="130;155;130" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.03;0.07;0.03" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- RIGHT SIDE: AUTOMATED WAREHOUSE DIGITAL TWIN GRAPHIC -->
  <g transform="translate(680, 30)">
    <!-- AS/RS High-Bay Racking Structure -->
    <rect x="190" y="25" width="280" height="240" rx="6" fill="#0b1120" fill-opacity="0.9" stroke="#1e293b" stroke-width="2"/>

    <!-- Rack Shelves & Columns -->
    <g stroke="#334155" stroke-width="2">
      <line x1="190" y1="85" x2="470" y2="85"/>
      <line x1="190" y1="145" x2="470" y2="145"/>
      <line x1="190" y1="205" x2="470" y2="205"/>

      <line x1="260" y1="25" x2="260" y2="265"/>
      <line x1="330" y1="25" x2="330" y2="265"/>
      <line x1="400" y1="25" x2="400" y2="265"/>
    </g>

    <!-- Stored Pallets / Totes inside Rack Cells -->
    <rect x="200" y="37" width="50" height="36" rx="4" fill="url(#blueGrad)" fill-opacity="0.8" stroke="#38bdf8"/>
    <rect x="270" y="37" width="50" height="36" rx="4" fill="url(#greenGrad)" fill-opacity="0.8" stroke="#34d399"/>
    <rect x="340" y="37" width="50" height="36" rx="4" fill="url(#purpleGrad)" fill-opacity="0.8" stroke="#c084fc"/>
    <rect x="410" y="37" width="50" height="36" rx="4" fill="url(#orangeGrad)" fill-opacity="0.8" stroke="#fbbf24"/>

    <rect x="200" y="97" width="50" height="36" rx="4" fill="url(#greenGrad)" fill-opacity="0.8" stroke="#34d399"/>
    <rect x="270" y="97" width="50" height="36" rx="4" fill="url(#orangeGrad)" fill-opacity="0.8" stroke="#fbbf24"/>
    <rect x="410" y="97" width="50" height="36" rx="4" fill="url(#blueGrad)" fill-opacity="0.8" stroke="#38bdf8"/>

    <rect x="200" y="157" width="50" height="36" rx="4" fill="url(#purpleGrad)" fill-opacity="0.8" stroke="#c084fc"/>
    <rect x="340" y="157" width="50" height="36" rx="4" fill="url(#blueGrad)" fill-opacity="0.8" stroke="#38bdf8"/>
    <rect x="410" y="157" width="50" height="36" rx="4" fill="url(#greenGrad)" fill-opacity="0.8" stroke="#34d399"/>

    <rect x="200" y="217" width="50" height="36" rx="4" fill="url(#blueGrad)" fill-opacity="0.8" stroke="#38bdf8"/>
    <rect x="270" y="217" width="50" height="36" rx="4" fill="url(#purpleGrad)" fill-opacity="0.8" stroke="#c084fc"/>
    <rect x="340" y="217" width="50" height="36" rx="4" fill="url(#orangeGrad)" fill-opacity="0.8" stroke="#fbbf24"/>

    <!-- AS/RS Stacker Crane Mast (Vertical Guide) -->
    <line x1="330" y1="20" x2="330" y2="270" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>

    <!-- Dynamic Animated AS/RS Crane Carriage Lifting & Lowering -->
    <g transform="translate(0, 0)">
      <animateTransform attributeName="transform" type="translate"
        values="0,40; 0,160; 0,40" keyTimes="0; 0.5; 1" dur="7s" repeatCount="indefinite"/>
      <!-- Crane Carriage -->
      <rect x="314" y="20" width="32" height="24" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
      <!-- Crane Telescopic Forks -->
      <line x1="346" y1="32" x2="385" y2="32" stroke="#38bdf8" stroke-width="3"/>
      <!-- Status Blinking LED -->
      <circle cx="320" cy="32" r="3" fill="#10b981">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Main Conveyor Transport Line -->
    <g transform="translate(0, 245)">
      <!-- Conveyor Frame -->
      <rect x="20" y="15" width="455" height="22" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <line x1="25" y1="26" x2="470" y2="26" stroke="#0284c7" stroke-width="4" stroke-dasharray="12 8">
        <animate attributeName="stroke-dashoffset" from="40" to="0" dur="1.5s" repeatCount="indefinite"/>
      </line>

      <!-- Conveyor Rollers -->
      <circle cx="60" cy="26" r="5" fill="#1e293b" stroke="#64748b"/>
      <circle cx="160" cy="26" r="5" fill="#1e293b" stroke="#64748b"/>
      <circle cx="260" cy="26" r="5" fill="#1e293b" stroke="#64748b"/>
      <circle cx="360" cy="26" r="5" fill="#1e293b" stroke="#64748b"/>
      <circle cx="450" cy="26" r="5" fill="#1e293b" stroke="#64748b"/>

      <!-- Moving Tote 1 on Conveyor (Dynamic SMIL Animation) -->
      <g>
        <animateTransform attributeName="transform" type="translate"
          from="-60, 0" to="440, 0" dur="5s" repeatCount="indefinite"/>
        <rect x="40" y="2" width="38" height="20" rx="3" fill="url(#blueGrad)" stroke="#38bdf8" stroke-width="1.5"/>
        <line x1="48" y1="12" x2="70" y2="12" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
      </g>

      <!-- Moving Tote 2 on Conveyor (Offset) -->
      <g>
        <animateTransform attributeName="transform" type="translate"
          from="-180, 0" to="320, 0" dur="5s" repeatCount="indefinite"/>
        <rect x="40" y="2" width="38" height="20" rx="3" fill="url(#greenGrad)" stroke="#34d399" stroke-width="1.5"/>
        <line x1="48" y1="12" x2="70" y2="12" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
      </g>
    </g>

    <!-- Autonomous Mobile Robot (AMR / AGV) with Cargo -->
    <g transform="translate(0, 285)">
      <g>
        <!-- Back-and-forth movement across floor -->
        <animateTransform attributeName="transform" type="translate"
          values="20,0; 260,0; 20,0" keyTimes="0; 0.5; 1" dur="9s" repeatCount="indefinite"/>

        <!-- AMR Chassis -->
        <rect x="0" y="0" width="76" height="30" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
        <!-- AMR Wheels -->
        <circle cx="16" cy="26" r="6" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
        <circle cx="60" cy="26" r="6" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
        <!-- Navigation LiDAR / Scanner Sensor -->
        <rect x="28" y="-6" width="20" height="8" rx="3" fill="#047857" stroke="#34d399" stroke-width="1"/>
        <!-- Front & Rear Beacon Lights -->
        <circle cx="10" cy="14" r="3.5" fill="#10b981">
          <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="66" cy="14" r="3.5" fill="#38bdf8">
          <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
        </circle>

        <!-- Pallet Loaded on AMR Top -->
        <rect x="14" y="-22" width="48" height="18" rx="3" fill="url(#purpleGrad)" stroke="#c084fc" stroke-width="1.5"/>
        <line x1="22" y1="-13" x2="54" y2="-13" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
      </g>
    </g>
  </g>

  <!-- LEFT CONTENT: BRANDING & INTRALOGISTICS TEXT -->
  <g transform="translate(60, 60)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="240" height="30" rx="15" fill="#0284c7" fill-opacity="0.2" stroke="#0ea5e9" stroke-width="1.5"/>
      <circle cx="16" cy="15" r="4.5" fill="#10b981">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1">INTRALOGISTICS &amp; WCS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#cyanGrad)" letter-spacing="-0.5">Awesome WCS</text>
    <text x="0" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#f8fafc">Warehouse Control Systems</text>

    <!-- Subtitle -->
    <text x="0" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">Material Flow Control (MFC) • Execution (WES) • PLC Automation</text>

    <!-- Four Capabilities Feature Badges -->
    <g transform="translate(0, 190)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="34" rx="17" fill="url(#pillGrad)" stroke="#475569" stroke-width="1"/>
        <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⚡ Real-Time MHE</text>
      </g>

      <!-- Badge 2 -->
      <g transform="translate(140, 0)">
        <rect width="165" height="34" rx="17" fill="url(#pillGrad)" stroke="#475569" stroke-width="1"/>
        <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">📦 AS/RS &amp; Conveyors</text>
      </g>

      <!-- Badge 3 -->
      <g transform="translate(315, 0)">
        <rect width="150" height="34" rx="17" fill="url(#pillGrad)" stroke="#475569" stroke-width="1"/>
        <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🤖 AMR / AGV Fleets</text>
      </g>

      <!-- Badge 4 -->
      <g transform="translate(475, 0)">
        <rect width="135" height="34" rx="17" fill="#065f46" fill-opacity="0.5" stroke="#10b981" stroke-width="1"/>
        <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399">⭐ Open Source</text>
      </g>
    </g>
  </g>
</svg>